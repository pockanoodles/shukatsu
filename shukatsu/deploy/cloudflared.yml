# Cloudflare Tunnel: a public HTTPS address with no open port on the home router.
#   cloudflared tunnel login
#   cloudflared tunnel create shukatsu
#   cloudflared tunnel route dns shukatsu shukatsu.example.com
#   cloudflared tunnel --config shukatsu/deploy/cloudflared.yml run shukatsu
# Then set SHUKATSU_URL=https://shukatsu.example.com and
# SHUKATSU_ALLOWED_ORIGINS=shukatsu.example.com in shukatsu/.env.
#
# Optional second lock: put a Cloudflare Access application (email one-time code)
# in front of the hostname, allowing only the people you invite. The app's own
# sign-in still applies behind it.
#
# With Access on, add a bypass policy for the paths that machines call, since a
# remote MCP client or a calendar app can't complete an Access login. They carry
# their own authentication (tokens, OAuth, private feed links):
#   /mcp   /oauth/*   /.well-known/oauth-*   /cal/*   /api/v1/*   /connectors/*

tunnel: shukatsu
credentials-file: /home/shukatsu/.cloudflared/shukatsu.json

ingress:
  - hostname: shukatsu.example.com
    service: http://127.0.0.1:3000
  - service: http_status:404
